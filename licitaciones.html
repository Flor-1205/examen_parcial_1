<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Licitaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <header class="container-fluid text-white p-4"
            style="background-color: #5B4034;">
        <h1>Mueblesig Honduras</h1>
    </header>

    <nav class="navbar navbar-expand-lg navbar-dark"
         style="background-color: #5B4034;">
        <div class="container">

            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Inicio</a>
                <a class="nav-link" href="catalago.html">Catálogo</a>
                <a class="nav-link" href="lotes.html">Lotes Especiales</a>
                <a class="nav-link active" href="licitaciones.html">Licitaciones</a>
                <a class="nav-link" href="contacto.html">Contacto</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid p-4 text-center"
         style="background-color: #E8D8C3;">

        <h2>Datos de la institución</h2>
        <p>Registra los datos de tu institución para conocer nuestros productos 
            y participar en las licitaciones.</p>

    </div>

    <div class="container my-4">

        <form action="#" method="post">

            <div class="mb-3">
                <label for="institucion" class="form-label">
                    Nombre de la institución:
                </label>
                <input type="text" class="form-control"
                       id="institucion" name="institucion" required>
            </div>

            <div class="mb-3">
                <label for="rtn" class="form-label">RTN:</label>
                <input type="text" class="form-control"
                       id="rtn" name="rtn"
                       pattern="[0-9]{14}" maxlength="14"
                       title="El RTN debe tener exactamente 14 dígitos."
                       required>
            </div>
            <div class="mb-3">
                <label for="contacto" class="form-label">
                    Nombre de la persona de contacto:
                </label>
                <input type="text" class="form-control"
                       id="contacto" name="contacto" required>
            </div>

            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono:</label>
                <input type="tel" class="form-control"
                       id="telefono" name="telefono" required>
            </div>

            <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico:</label>
                <input type="email" class="form-control"
                       id="correo" name="correo" required>
            </div>

            <div class="mb-3">
                <label for="departamento" class="form-label">
                    Departamento:
                </label>

                <select class="form-select" id="departamento"
                        name="departamento" required>
                    <option value="">Seleccione un departamento</option>
                    <option value="Francisco Morazan">Francisco Morazán</option>
                    <option value="Comayagua">Comayagua</option>
                    <option value="Cortes">Cortés</option>
                    <option value="Yoro">Yoro</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input"
                       id="terminos" name="terminos" required>
                <label for="terminos" class="form-check-label">
                    Acepto los términos y condiciones.
                </label>
            </div>

            <button type="submit" class="btn text-white"
                    style="background-color: #5B4034;">
                Enviar solicitud
            </button>

        </form>

    </div>

    <footer class="text-white text-center p-3"
            style="background-color: #5B4034;">
        <p class="mb-0">&copy; Mueblesig Honduras</p>
    </footer>

</body>
</html>
